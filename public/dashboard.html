<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dashboard {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.15);
        }

        button {
            padding: 12px 25px;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

    </style>
</head>

<body>

    <div class="dashboard">

        <h1>
            Welcome,
            <span id="userName"></span>!
        </h1>

        <p>
            You have successfully logged in.
        </p>

        <button id="logoutButton">
            Log Out
        </button>

    </div>


    <script>

        // Get name from localStorage
        const userName =
            localStorage.getItem('userName');


        // If user is not logged in,
        // return to login page
        if (!userName) {

            window.location.href =
                '/index.html';

        } else {

            document.getElementById('userName')
                .textContent = userName;

        }


        // Logout
        document
            .getElementById('logoutButton')
            .addEventListener('click', function() {

                localStorage.removeItem('userName');

                window.location.href =
                    '/index.html';

            });

    </script>

</body>
</html>
